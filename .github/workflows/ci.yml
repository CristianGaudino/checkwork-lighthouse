name: CI

# Pull requests only; the deploy builds and tests again. GitHub Actions minutes are limited (2,000 a month, shared).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # The Worker has to start before a change reaches production: the normal build can't see what only fails on Cloudflare.
  worker:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
      - name: Start the Worker and request it
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          curl -s -o /dev/null --retry 60 --retry-connrefused --retry-delay 2 http://127.0.0.1:8787/favicon.svg || true
          fail=0
          check() { got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$2"); echo "$1: $got (want $3)"; [ "$got" = "$3" ] || fail=1; }
          # No Access in front of the local Worker, so the private page must refuse
          check "home (closed)" http://127.0.0.1:8787/ 404
          check "not found" http://127.0.0.1:8787/nope 404
          if grep -q 'ERROR' wrangler.log; then echo 'the Worker logged an error'; fail=1; fi
          if [ $fail = 1 ]; then grep -iE 'error|failed' wrangler.log | sort -u | head -20; exit 1; fi

  # Playwright against a production build, in the image that has the browsers built in (no install step to stall).
  # Keep the tag in step with @playwright/test in package-lock.json.
  e2e:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Image matches the locked Playwright
        run: |
          locked=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          image=$(grep -ho 'playwright:v[0-9.]*-' .github/workflows/*.yml | sed 's/playwright:v//; s/-$//' | sort -u)
          [ "$locked" = "$image" ] || { echo "::error::The workflow images are Playwright $image but package-lock.json has $locked: change the tags (ci.yml and deploy-workers.yml)"; exit 1; }
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
