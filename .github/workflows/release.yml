name: Release

# NOT ENABLED YET: the release job is skipped until the repository variable DEPLOY_ENABLED is set to 'true' (issue #3).
#
# Cut by hand when a batch is ready: Actions → Release → Run workflow, then pick major, minor or patch.
# It works out the next version from the latest tag (the first release is v1.0.0), tags the tip of main and
# publishes a GitHub release whose notes are the merged pull requests since the last one. It then deploys that tag to production (deploy-workers.yml).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'major: breaking or a big change · minor: new features · patch: fixes only'
        required: true
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: write

jobs:
  release:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every tag, to find the latest
          fetch-depth: 0
          ref: main
      - name: Work out the next version
        id: next
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            next=v1.0.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v$major.$((minor + 1)).0" ;;
              patch) next="v$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "Latest: ${latest:-none}, next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ inputs.bump }}
      - name: Publish the release
        run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target main --title "$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}

  deploy:
    needs: release
    uses: ./.github/workflows/deploy-workers.yml
    with:
      ref: ${{ needs.release.outputs.version }}
    secrets: inherit
