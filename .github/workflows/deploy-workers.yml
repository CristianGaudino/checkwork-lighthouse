name: Deploy (Cloudflare Workers)

# NOT ENABLED YET. Every job is skipped until the repository variable DEPLOY_ENABLED is set to 'true'
# (Settings > Secrets and variables > Actions > Variables). Set it only after the owner steps in issue #3 are done.
#
# Production: a release (release.yml calls this with its tag) tests, builds on Linux
# (OpenNext doesn't support building on Windows), deploys the lighthouse Worker, waits for the site, then runs the e2e
# tests against it. Merging to main deploys nothing. From the Actions tab, run it with an older tag to roll back.
on:
  workflow_call:
    inputs:
      ref:
        description: 'The release tag to deploy'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 'The release tag to deploy, like v1.0.0'
        required: true
        type: string

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # CI does not run on main: the pull request ran it on an older main, so a merge of several is tested here
      - name: Tests
        run: npm test
        # The unit tests assume a non-production env; the job-level APP_ENV would break them
        env:
          APP_ENV: ''
      - run: npx opennextjs-cloudflare build
      - name: Deploy
        run: npx wrangler deploy --var APP_COMMIT_SHA:${{ github.sha }} --var "APP_VERSION:$(git describe --tags --always)"
      # A first deploy waits a few minutes for the address's certificate. Access answers with a redirect to its login, which is a pass.
      - name: Wait for the site
        run: curl -fsS -o /dev/null --retry 40 --retry-delay 15 --retry-all-errors --max-time 20 https://www.lighthouse.checkwork.ie/

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      E2E_BASE_URL: https://www.lighthouse.checkwork.ie
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Keep the image tag in step with @playwright/test in package-lock.json (ci.yml checks this)
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
