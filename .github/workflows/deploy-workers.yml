name: Deploy (Cloudflare Workers)

# Every merge to main deploys (owner's call while the bulk of the work is under way; release tags can come back later,
# as in vintage). It tests, builds on Linux (OpenNext doesn't support building on Windows), deploys the lighthouse
# Worker, waits for the site, then runs the e2e tests against it. Skipped while the repository variable DEPLOY_ENABLED
# is not 'true'. To roll back, run it from the Actions tab with an older commit or tag.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      ref:
        description: 'A commit or tag to deploy (default: main)'
        required: false
        type: string

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # CI does not run on main: the pull request ran it on an older main, so a merge of several is tested here
      - name: Tests
        run: npm test
        # The unit tests assume a non-production env; the job-level APP_ENV would break them
        env:
          APP_ENV: ''
      - run: npx opennextjs-cloudflare build
      - name: Deploy
        run: npx wrangler deploy --var "APP_COMMIT_SHA:$(git rev-parse HEAD)" --var "APP_VERSION:$(git describe --tags --always)"
      # A first deploy waits a few minutes for the address's certificate. Access answers with a redirect to its login, which is a pass.
      - name: Wait for the site
        run: curl -fsS -o /dev/null --retry 40 --retry-delay 15 --retry-all-errors --max-time 20 https://www.lighthouse.checkwork.ie/

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    env:
      E2E_BASE_URL: https://www.lighthouse.checkwork.ie
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Keep the image tag in step with @playwright/test in package-lock.json (ci.yml checks this)
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
